<title>Ten-Second Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600&family=Martian+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg:      #F1F2EE;
    --surface: #FFFFFF;
    --ink:     #1A1D1B;
    --muted:   #6C7370;
    --line:    #DCE0D9;
    --track:   #E3E7E0;
    --accent:  #1F6F5C;
    --alert:   #D9480F;
    --shadow:  0 1px 2px rgba(26,29,27,.05), 0 8px 24px -12px rgba(26,29,27,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #14181A;
      --surface: #1C2123;
      --ink:     #E9ECE8;
      --muted:   #8D9793;
      --line:    #2C3234;
      --track:   #2A3134;
      --accent:  #4FBFA0;
      --alert:   #FF7A45;
      --shadow:  0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg:      #14181A;
    --surface: #1C2123;
    --ink:     #E9ECE8;
    --muted:   #8D9793;
    --line:    #2C3234;
    --track:   #2A3134;
    --accent:  #4FBFA0;
    --alert:   #FF7A45;
    --shadow:  0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Chivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 36px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    max-width: 380px;
    width: 100%;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dial { position: relative; width: 260px; height: 260px; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .dial .track { fill: none; stroke: var(--track); stroke-width: 6; }
  .dial .sweep {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke .2s ease;
  }
  .readout {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Martian Mono", ui-monospace, "SFMono-Regular", monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.04em;
  }
  .whole { font-size: 68px; font-weight: 700; line-height: 1; }
  .frac  { font-size: 30px; font-weight: 400; color: var(--muted); line-height: 1; align-self: flex-end; padding-bottom: 6px; }

  .controls { display: flex; gap: 10px; width: 100%; }
  button {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .01em;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .primary { background: var(--accent); color: var(--surface); }
  .primary:hover { opacity: .88; }
  .ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status { font-size: 12px; color: var(--muted); min-height: 1em; }

  /* Zero state */
  .done .sweep { stroke: var(--alert); }
  .done .whole, .done .frac { color: var(--alert); }
  .done .dial { animation: pulse .5s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.035); } }
  @media (prefers-reduced-motion: reduce) {
    .done .dial { animation: none; }
  }
</style>

<main class="panel" id="panel">
  <p class="eyebrow">10 second countdown</p>

  <div class="dial">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <circle class="track" cx="130" cy="130" r="118"></circle>
      <circle class="sweep" id="sweep" cx="130" cy="130" r="118"></circle>
    </svg>
    <div class="readout" role="timer" aria-live="off">
      <span class="whole" id="whole">10</span><span class="frac" id="frac">.0</span>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="main">Start</button>
    <button class="ghost" id="reset">Reset</button>
  </div>

  <p class="status" id="status">Ready</p>
</main>

<script>
  var DURATION = 10000;
  var CIRC = 2 * Math.PI * 118;

  var panel  = document.getElementById('panel');
  var sweep  = document.getElementById('sweep');
  var whole  = document.getElementById('whole');
  var frac   = document.getElementById('frac');
  var mainBtn = document.getElementById('main');
  var resetBtn = document.getElementById('reset');
  var status = document.getElementById('status');

  sweep.style.strokeDasharray = CIRC;

  var remaining = DURATION;   // ms left when paused / idle
  var endAt = null;           // absolute target while running
  var raf = null;

  function render(ms) {
    if (ms < 0) ms = 0;
    var tenths = Math.ceil(ms / 100);
    whole.textContent = Math.floor(tenths / 10);
    frac.textContent = '.' + (tenths % 10);
    sweep.style.strokeDashoffset = CIRC * (1 - ms / DURATION);
  }

  function tick() {
    var left = endAt - Date.now();
    if (left <= 0) { finish(); return; }
    render(left);
    raf = requestAnimationFrame(tick);
  }

  function start() {
    panel.classList.remove('done');
    endAt = Date.now() + remaining;
    mainBtn.textContent = 'Pause';
    status.textContent = 'Counting down';
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    cancelAnimationFrame(raf);
    remaining = Math.max(0, endAt - Date.now());
    endAt = null;
    mainBtn.textContent = 'Resume';
    status.textContent = 'Paused';
  }

  function finish() {
    cancelAnimationFrame(raf);
    endAt = null;
    remaining = 0;
    render(0);
    panel.classList.add('done');
    mainBtn.textContent = 'Start';
    status.textContent = 'Time';
    ring();
  }

  function reset() {
    cancelAnimationFrame(raf);
    endAt = null;
    remaining = DURATION;
    panel.classList.remove('done');
    render(DURATION);
    mainBtn.textContent = 'Start';
    status.textContent = 'Ready';
  }

  /* Three short beeps, synthesized — no audio file to load. */
  var audioCtx = null;
  function ring() {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      for (var i = 0; i < 3; i++) {
        var at = t0 + i * 0.26;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.35, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + 0.22);
      }
    } catch (e) { /* audio unavailable — the visual cue still fires */ }
  }

  mainBtn.addEventListener('click', function () {
    if (endAt) { pause(); return; }
    if (remaining <= 0) reset();
    start();
  });
  resetBtn.addEventListener('click', reset);

  render(DURATION);
</script>
