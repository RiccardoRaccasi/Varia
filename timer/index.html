<title>Interval Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600&family=Martian+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg:        #F1F2EE;
    --surface:   #FFFFFF;
    --surface-2: #F6F8F4;
    --ink:       #1A1D1B;
    --muted:     #6C7370;
    --line:      #DCE0D9;
    --track:     #E3E7E0;
    --seq:       #1F6F5C;
    --par:       #4A6FA5;
    --rest:      #4A6FA5;
    --alert:     #D9480F;
    --on-accent: #FFFFFF;
    --shadow:    0 1px 2px rgba(26,29,27,.05), 0 10px 30px -18px rgba(26,29,27,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14181A;
      --surface:   #1C2123;
      --surface-2: #232A2C;
      --ink:       #E9ECE8;
      --muted:     #8D9793;
      --line:      #2C3234;
      --track:     #2A3134;
      --seq:       #4FBFA0;
      --par:       #7FA9DC;
      --rest:      #7FA9DC;
      --alert:     #FF7A45;
      --on-accent: #10201C;
      --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14181A;
    --surface:   #1C2123;
    --surface-2: #232A2C;
    --ink:       #E9ECE8;
    --muted:     #8D9793;
    --line:      #2C3234;
    --track:     #2A3134;
    --seq:       #4FBFA0;
    --par:       #7FA9DC;
    --rest:      #7FA9DC;
    --alert:     #FF7A45;
    --on-accent: #10201C;
    --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px -18px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Chivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    padding: 20px 0 56px;
  }

  .app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .gutter { padding: 0 20px; }

  .label {
    font-size: 10px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
  }
  .mono {
    font-family: "Martian Mono", ui-monospace, "SFMono-Regular", monospace;
    font-variant-numeric: tabular-nums; letter-spacing: -.05em;
  }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .wordmark { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .wordmark span { color: var(--muted); font-weight: 400; }
  .topbar-acts { display: flex; align-items: center; gap: 8px; }

  /* ---------- buttons ---------- */
  button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    border-radius: 9px; border: 1px solid transparent;
    padding: 9px 13px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
  }
  button:focus-visible { outline: 2px solid var(--accent, var(--seq)); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .btn-solid { background: var(--accent, var(--seq)); color: var(--on-accent); }
  .btn-solid:hover:not(:disabled) { opacity: .87; }
  .btn-quiet { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn-quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .btn-dark { background: var(--ink); color: var(--bg); }
  .btn-dark:hover { opacity: .85; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  .icon-btn {
    background: transparent; border-color: transparent; color: var(--muted);
    padding: 4px 7px; font-size: 12px; font-weight: 400; line-height: 1;
  }
  .icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
  .icon-btn.danger:hover:not(:disabled) { color: var(--alert); }

  .sound-toggle { background: transparent; border-color: var(--line); color: var(--muted); font-size: 11px; font-weight: 500; padding: 6px 11px; }
  .sound-toggle:hover { color: var(--ink); }
  .sound-toggle[aria-pressed="true"] { color: var(--seq); border-color: var(--seq); }

  /* ---------- alarm banner ---------- */
  .alarms { display: flex; flex-direction: column; gap: 8px; }
  .alarm-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--alert); color: #FFF;
    border-radius: 12px; padding: 12px 12px 12px 16px;
  }
  .alarm-row .what { flex: 1; font-weight: 600; }
  .alarm-row button { background: rgba(255,255,255,.16); color: #FFF; border-color: rgba(255,255,255,.35); }
  .alarm-row button:hover { background: rgba(255,255,255,.28); }

  /* ---------- board ---------- */
  .board {
    display: flex; gap: 14px; align-items: flex-start;
    overflow-x: auto; padding: 2px 20px 8px;
    scroll-snap-type: x proximity;
    position: relative;               /* so a column's offsetLeft is board-relative */
  }

  /* layout switch */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button {
    border: none; border-radius: 0; background: transparent; color: var(--muted);
    padding: 6px 10px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  /* on Auto, show which of the two the width actually resolved to */
  .seg button.is-effective { background: var(--surface-2); color: var(--ink); }

  /* phone pager */
  .pager {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 14px 2px; scrollbar-width: none;
  }
  .pager::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 7px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 600;
  }
  .chip.is-running { border-color: var(--seq); color: var(--ink); }
  .chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip-clock { font-size: 11px; font-weight: 700; }
  .chip-clock .frac { font-size: .8em; font-weight: 400; opacity: .65; }

  /* ---------- phone layout ---------- */
  body[data-layout="phone"] .board {
    scroll-snap-type: x mandatory;
    scroll-padding-left: 14px;
    padding: 2px 14px 8px; gap: 12px;
  }
  body[data-layout="phone"] .column,
  body[data-layout="phone"] .add-column { flex: 0 0 calc(100% - 22px); }
  body[data-layout="phone"] .add-column { height: 130px; }
  body[data-layout="phone"] .column { padding: 14px 12px 14px; }
  body[data-layout="phone"] .dial { width: min(240px, 62vw); }
  body[data-layout="phone"] .runner-ctl button { padding: 13px 12px; font-size: 14px; }
  body[data-layout="phone"] .tile-ctl button { padding: 11px 12px; font-size: 13px; }
  body[data-layout="phone"] .tile { padding: 11px 9px 11px 11px; }
  body[data-layout="phone"] .icon-btn { padding: 7px 9px; font-size: 13px; }
  body[data-layout="phone"] .move-col .icon-btn { padding: 2px 8px; font-size: 10px; }
  body[data-layout="phone"] .wordmark span { display: none; }
  body[data-layout="phone"] #newColBtn { display: none; }
  body[data-layout="phone"] .gutter { padding: 0 14px; }
  .column {
    --accent: var(--seq);
    flex: 0 0 300px; scroll-snap-align: start;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px;
    padding: 14px 12px 12px;
  }
  .column.is-parallel { --accent: var(--par); }
  .column.is-running { border-color: var(--accent); }

  .col-head { display: flex; flex-direction: column; gap: 8px; }
  .col-title-row { display: flex; align-items: center; gap: 4px; }
  .col-title {
    flex: 1; min-width: 0;
    background: none; border: none; padding: 3px 5px; border-radius: 7px;
    font: inherit; font-size: 15px; font-weight: 600; color: inherit; text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .col-title:hover { background: var(--surface-2); color: var(--accent); }
  .col-sub { display: flex; align-items: center; gap: 6px; padding-left: 5px; }
  .mode-pill {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .mode-pill:hover { background: var(--accent); color: var(--on-accent); }
  .col-total { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; padding-right: 2px; }

  /* ---------- sequence runner ---------- */
  .runner {
    background: var(--surface-2); border-radius: 12px;
    padding: 14px 12px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .runner.is-rest { --accent: var(--rest); }
  .runner.is-done { --accent: var(--alert); }
  .runner-kind { color: var(--accent); }
  .runner-name { font-size: 14px; font-weight: 600; text-align: center; text-wrap: balance; line-height: 1.25; }

  .dial { position: relative; width: 150px; aspect-ratio: 1; container-type: inline-size; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .dial .track { fill: none; stroke: var(--track); stroke-width: 8; }
  .dial .sweep { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke .25s ease; }

  /* Centred in the dial, with the digits and tenths sharing one
     baseline; size steps down as the clock grows a minutes or hours
     field so it always clears the ring. */
  .readout { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .readout-row { display: flex; align-items: baseline; font-size: 26px; font-size: 18cqw; }
  .readout-row.wide  { font-size: 15cqw; }
  .readout-row.wider { font-size: 11cqw; }
  .readout-row .whole { font-size: 1em; font-weight: 700; line-height: 1; }
  .readout-row .frac { font-size: .48em; font-weight: 400; line-height: 1; color: var(--muted); }
  .runner.is-done .whole, .runner.is-done .frac { color: var(--alert); }

  .runner-meta { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .runner-next { font-size: 11px; color: var(--muted); }
  .runner-ctl { display: flex; gap: 6px; width: 100%; }
  .runner-ctl .btn-solid { flex: 2; }
  .runner-ctl .btn-quiet { flex: 1; }

  /* ---------- timer tiles ---------- */
  .tiles { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .tile {
    border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 8px 9px 10px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .tile.active { border-color: var(--accent); background: var(--surface-2); }
  .tile-top { display: flex; align-items: flex-start; gap: 6px; }
  .tile-main {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;
    background: none; border: none; padding: 2px 3px; border-radius: 7px;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .tile-main:hover:not(:disabled) { background: var(--surface); }
  .tile-main:hover:not(:disabled) .tile-name { color: var(--accent); }
  .tile-main:disabled { opacity: 1; cursor: default; }
  .tile-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-spec { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile-acts { display: flex; align-items: center; flex-shrink: 0; }
  .move-col { display: flex; flex-direction: column; }
  .move-col .icon-btn { padding: 0 5px; font-size: 9px; }

  .tile-live { display: flex; flex-direction: column; gap: 6px; }
  .live-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .live-clock { display: flex; align-items: baseline; font-size: 21px; font-weight: 700; line-height: 1; color: var(--accent); }
  .live-clock .frac { font-size: .5em; font-weight: 400; color: var(--muted); }
  .live-note { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
  .bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .tile-ctl { display: flex; gap: 6px; }
  .tile-ctl button { flex: 1; }

  .empty {
    border: 1px dashed var(--line); border-radius: 11px;
    padding: 18px 12px; text-align: center; color: var(--muted); font-size: 12px;
  }
  .col-foot { display: flex; gap: 6px; }
  .col-foot .btn-quiet { flex: 1; }

  .add-column {
    flex: 0 0 176px; align-self: flex-start; height: 168px;
    border: 1px dashed var(--line); border-radius: 16px;
    background: transparent; color: var(--muted); font-weight: 600; cursor: pointer;
  }
  .add-column:hover { color: var(--seq); border-color: var(--seq); }

  .hint-line { font-size: 12px; color: var(--muted); }

  /* ---------- dialogs ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 0;
    background: var(--surface); color: var(--ink);
    width: min(400px, calc(100vw - 32px)); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(10,14,13,.5); }
  .form-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > .label { color: var(--muted); }
  input[type="text"], input[type="number"], select {
    font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 11px; width: 100%;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--seq); outline-offset: 1px; }
  .duo { display: flex; gap: 8px; }
  .duo .field { flex: 1; }
  .unit { font-size: 11px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .form-foot { display: flex; gap: 8px; padding: 0 20px 20px; }
  .form-foot button { flex: 1; }
  .form-foot .btn-solid { --accent: var(--seq); flex: 2; }
  .confirm-body { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .confirm-body p { font-size: 13px; color: var(--muted); }
  .form-foot .btn-danger { background: var(--alert); color: #FFF; flex: 2; }
  .form-foot .btn-danger:hover { opacity: .87; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">

  <div class="topbar gutter">
    <div class="wordmark">Interval Stack <span>— stacks side by side</span></div>
    <div class="topbar-acts">
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" id="segAuto" aria-pressed="true">Auto</button>
        <button type="button" id="segBoard" aria-pressed="false">Board</button>
        <button type="button" id="segPhone" aria-pressed="false">Phone</button>
      </div>
      <button class="sound-toggle" id="soundBtn" aria-pressed="true">Sound on</button>
      <button class="btn-dark btn-sm" id="newColBtn">+ New stack</button>
    </div>
  </div>

  <div class="alarms gutter" id="alarms" hidden></div>

  <div class="pager" id="pager" hidden></div>

  <div class="board" id="board"></div>

  <p class="hint-line gutter" id="hintLine"></p>
</div>

<!-- timer editor -->
<dialog id="editor">
  <form id="form">
    <div class="form-body">
      <div class="label" id="formTitle">New timer</div>

      <div class="field">
        <label class="label" for="fName">Name</label>
        <input type="text" id="fName" maxlength="40" placeholder="Bench press" required>
      </div>

      <div class="field">
        <label class="label" for="fStack">Stack</label>
        <select id="fStack"></select>
      </div>

      <div class="field">
        <span class="label">Work</span>
        <div class="duo">
          <div class="field">
            <input type="number" id="fWorkMin" min="0" max="600" step="1" value="0" inputmode="numeric">
            <span class="unit">minutes</span>
          </div>
          <div class="field">
            <input type="number" id="fWorkSec" min="0" max="59" step="1" value="30" inputmode="numeric">
            <span class="unit">seconds</span>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="label">Rest</span>
        <div class="duo">
          <div class="field">
            <input type="number" id="fRestMin" min="0" max="600" step="1" value="0" inputmode="numeric">
            <span class="unit">minutes</span>
          </div>
          <div class="field">
            <input type="number" id="fRestSec" min="0" max="59" step="1" value="15" inputmode="numeric">
            <span class="unit">seconds</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="fRounds">Rounds</label>
        <input type="number" id="fRounds" min="1" max="99" step="1" value="1" inputmode="numeric">
        <span class="hint">Work then rest, repeated this many times.</span>
      </div>
    </div>
    <div class="form-foot">
      <button type="button" class="btn-quiet" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-solid" id="saveBtn">Add timer</button>
    </div>
  </form>
</dialog>

<!-- rename stack -->
<dialog id="renamer">
  <form id="renameForm">
    <div class="form-body">
      <div class="label">Rename stack</div>
      <div class="field">
        <label class="label" for="rName">Name</label>
        <input type="text" id="rName" maxlength="30" required>
      </div>
    </div>
    <div class="form-foot">
      <button type="button" class="btn-quiet" id="renameCancel">Cancel</button>
      <button type="submit" class="btn-solid">Save name</button>
    </div>
  </form>
</dialog>

<!-- confirm -->
<dialog id="confirmer">
  <div class="confirm-body">
    <div class="label" id="confirmTitle">Delete stack</div>
    <p id="confirmText"></p>
  </div>
  <div class="form-foot">
    <button type="button" class="btn-quiet" id="confirmNo">Keep it</button>
    <button type="button" class="btn-danger" id="confirmYes">Delete</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  /* =========================================================
     MODEL
     board.columns[] = { id, name, mode: "sequence"|"parallel", timers[] }
     timer           = { id, name, work, rest, rounds }   (seconds)

     A SEQUENCE column runs as one queue: every timer, every round,
     back to back. A PARALLEL column runs nothing as a group — each
     timer starts on its own. Any number of runs go at once, so a
     pomodoro queue and a four-hour print can share the board.
     ========================================================= */

  var board = { columns: [] };
  var runs = Object.create(null);      // key -> run
  var alarming = Object.create(null);  // key -> label
  var live = Object.create(null);      // key -> live DOM nodes, rebuilt each render
  var raf = null;
  var db = null, touched = false;
  var liveTabs = [];                   // phone chips showing another stack's clock
  var columnEls = [];                  // rendered column nodes, for the pager
  var activeIndex = 0, scrollRaf = null;
  var DOC = "timers/board", OLD_DOC = "timers/library";
  var LS = "interval-stack-v2", OLD_LS = "interval-stack-v1";

  var el = {};
  ["board","alarms","hintLine","soundBtn","newColBtn","editor","form","formTitle","fName",
   "fStack","fWorkMin","fWorkSec","fRestMin","fRestSec","fRounds","cancelBtn","saveBtn",
   "renamer","renameForm","rName","renameCancel","confirmer","confirmTitle","confirmText",
   "confirmNo","confirmYes","pager","segAuto","segBoard","segPhone"].forEach(function (id) { el[id] = document.getElementById(id); });

  var R = 112, CIRC = 2 * Math.PI * R;

  /* ================= helpers ================= */

  function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function clock(ms) {
    if (!(ms > 0)) ms = 0;
    var tenths = Math.ceil(ms / 100);
    var sec = Math.floor(tenths / 10);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    var whole = h
      ? h + ":" + String(m).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0")
      : m + ":" + String(sec % 60).padStart(2, "0");
    return { whole: whole, frac: "." + (tenths % 10) };
  }

  function dur(sec) {
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + "h " + String(m).padStart(2, "0") + "m";
    return m + ":" + String(s).padStart(2, "0");
  }

  function timerSeconds(t) { return t.rounds * (t.work + t.rest); }
  function columnSeconds(c) { return c.timers.reduce(function (n, t) { return n + timerSeconds(t); }, 0); }

  /* Work then rest per round. The final rest of a run is dropped so a
     run ends on finished work, never on a dangling break. */
  function buildPhases(list) {
    var ph = [];
    list.forEach(function (t, ti) {
      for (var r = 1; r <= t.rounds; r++) {
        ph.push({ kind: "work", name: t.name, ms: t.work * 1000, round: r, rounds: t.rounds, id: t.id });
        var last = ti === list.length - 1 && r === t.rounds;
        if (t.rest > 0 && !last) {
          ph.push({ kind: "rest", name: t.name, ms: t.rest * 1000, round: r, rounds: t.rounds, id: t.id });
        }
      }
    });
    return ph;
  }

  function columnRuns(col) {
    var out = [];
    if (col.mode === "parallel") {
      col.timers.forEach(function (t) { var r = runs[keyForTimer(t)]; if (r) out.push(r); });
    } else {
      var r = runs[keyForColumn(col)];
      if (r) out.push(r);
    }
    return out;
  }

  function findColumn(id) {

  /* ================= audio ================= */

  /* ================= persistence ================= */

  function persist() {
    touched = true;

    try { localStorage.setItem(LS, JSON.stringify(body)); } catch (e) {}
    if (db) db.doc(DOC).set(body).catch(function () {});
  }

      name: (String(t.name == null ? "" : t.name).slice(0, 40) || "Timer"),
      work: Math.max(1, Math.min(86400, Math.round(Number(t.work) || 0))),
      rest: Math.max(0, Math.min(86400, Math.round(Number(t.rest) || 0))),

        { id: uid("t"), name: "Pomodoro", work: 1500, rest: 300, rounds: 4 }
      ] },
      { id: uid("c"), name: "Gym", mode: "sequence", timers: [
        { id: uid("t"), name: "Push circuit", work: 45, rest: 15, rounds: 8 }
      ] },

  function loadLocal() {

      var old = localStorage.getItem(OLD_LS);

          if (r.endAt) pauseRun(r); else { ctx(); resumeRun(r); }
        }));
        ctl.appendChild(textBtn("Stop", "btn-quiet btn-sm", function () { endRun(key); }));
      } else {
        ctl.appendChild(textBtn("Start", "btn-solid btn-sm", function () {
          begin(key, t.name, buildPhases([t]));
        }));
      }
      wrap.appendChild(ctl);
      li.appendChild(wrap);
    }

    return li;
  }

  function renderColumn(col, index) {
    var wrap = document.createElement("section");
    wrap.className = "column" + (col.mode === "parallel" ? " is-parallel" : "");
    wrap.setAttribute("aria-label", col.name);

    var running = col.mode === "parallel"
      ? col.timers.some(function (t) { return !!runs[keyForTimer(t)]; })
      : !!runs[keyForColumn(col)];
    if (running) wrap.classList.add("is-running");

    /* head */
    var head = document.createElement("div");
    head.className = "col-head";

    var titleRow = document.createElement("div");
    titleRow.className = "col-title-row";
    var title = document.createElement("button");
    title.type = "button"; title.className = "col-title"; title.textContent = col.name;
    title.title = "Rename this stack";
    title.setAttribute("aria-label", "Rename stack " + col.name);
    title.addEventListener("click", function () { openRenamer(col); });
    titleRow.appendChild(title);
    titleRow.appendChild(iconBtn("‹", "Move stack left", index === 0, function () { moveColumn(index, -1); }));
    titleRow.appendChild(iconBtn("›", "Move stack right", index === board.columns.length - 1, function () { moveColumn(index, 1); }));
    titleRow.appendChild(iconBtn("✕", "Delete stack " + col.name, running, function () { askDeleteColumn(col); }, true));
    head.appendChild(titleRow);

    var sub = document.createElement("div");
    sub.className = "col-sub";
    var pill = document.createElement("button");
    pill.type = "button"; pill.className = "mode-pill";
    pill.textContent = col.mode === "parallel" ? "Parallel" : "In order";
    pill.title = col.mode === "parallel"
      ? "Each timer runs on its own — click to chain them instead"
      : "Timers run back to back — click to make them independent";
    pill.disabled = running;
    pill.addEventListener("click", function () { toggleMode(col); });
    sub.appendChild(pill);
    var total = document.createElement("div");
    total.className = "col-total";
    total.textContent = col.timers.length
      ? col.timers.length + (col.timers.length === 1 ? " timer" : " timers")
        + (col.mode === "sequence" ? " · " + dur(columnSeconds(col)) : "")
      : "empty";
    sub.appendChild(total);
    head.appendChild(sub);
    wrap.appendChild(head);

    /* sequence stacks get one runner for the whole queue */
    if (col.mode === "sequence") wrap.appendChild(renderRunner(col));

    /* tiles */
    var list = document.createElement("ul");
    list.className = "tiles";
    if (!col.timers.length) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = col.mode === "parallel"
        ? "No timers yet. Each one here runs on its own."
        : "No timers yet. These will run back to back.";
      list.appendChild(empty);
    } else {
      col.timers.forEach(function (t, i) { list.appendChild(renderTile(col, t, i)); });
    }
    wrap.appendChild(list);

    var foot = document.createElement("div");
    foot.className = "col-foot";
    foot.appendChild(textBtn("+ Timer", "btn-quiet btn-sm", function () { openEditor(col, null); }));
    wrap.appendChild(foot);

    return wrap;
  }

  function render() {
    live = Object.create(null);
    renderAlarms();

    /* A phase change rebuilds the board; without this the swipe
       position would snap back to the first stack every interval. */
    var keepScroll = el.board.scrollLeft;

    el.board.textContent = "";
    columnEls = [];
    board.columns.forEach(function (col, i) {
      var node = renderColumn(col, i);
      columnEls.push(node);
      el.board.appendChild(node);
    });

    var add = document.createElement("button");
    add.type = "button"; add.className = "add-column"; add.textContent = "+ New stack";
    add.addEventListener("click", newColumn);
    el.board.appendChild(add);

    el.board.scrollLeft = keepScroll;
    renderPager();

    var running = Object.keys(runs).length;
    var phone = document.body.getAttribute("data-layout") === "phone";
    el.hintLine.textContent = running
      ? running + (running === 1 ? " timer running" : " timers running at once") + " — stacks keep their own clocks."
      : phone
        ? "Swipe between stacks. Tap a stack name to rename it."
        : "Click a stack name to rename it. “In order” chains its timers; “Parallel” runs each on its own.";

    paint();
  }

  /* ================= board actions ================= */

  function newColumn() {
    var col = { id: uid("c"), name: "New stack", mode: "sequence", timers: [] };
    board.columns.push(col);
    persist(); render();
    openRenamer(col);
  }

  function moveColumn(i, d) {
    var j = i + d;
    if (j < 0 || j >= board.columns.length) return;
    var tmp = board.columns[i]; board.columns[i] = board.columns[j]; board.columns[j] = tmp;
    persist(); render();
  }

  function toggleMode(col) {
    col.mode = col.mode === "parallel" ? "sequence" : "parallel";
    /* clear any runs belonging to this stack under the old shape */
    delete runs[keyForColumn(col)];
    col.timers.forEach(function (t) { delete runs[keyForTimer(t)]; delete alarming[keyForTimer(t)]; });
    delete alarming[keyForColumn(col)];
    if (!Object.keys(alarming).length) stopAlarm();
    persist(); render();
  }

  function moveTimer(col, i, d) {
    var j = i + d;
    if (j < 0 || j >= col.timers.length) return;
    var tmp = col.timers[i]; col.timers[i] = col.timers[j]; col.timers[j] = tmp;
    persist(); render();
  }

  function deleteTimer(col, id) {
    col.timers = col.timers.filter(function (t) { return t.id !== id; });
    delete runs["t:" + id];
    delete alarming["t:" + id];
    if (!Object.keys(alarming).length) stopAlarm();
    persist(); render();
  }

  /* ================= dialogs ================= */

  var editing = null, editingCol = null, renaming = null, confirmFn = null;

  function openEditor(col, t) {
    editing = t || null; editingCol = col;
    el.formTitle.textContent = t ? "Edit timer" : "New timer";
    el.saveBtn.textContent = t ? "Save changes" : "Add timer";
    el.fName.value = t ? t.name : "";
    el.fWorkMin.value = t ? Math.floor(t.work / 60) : 0;
    el.fWorkSec.value = t ? t.work % 60 : 30;
    el.fRestMin.value = t ? Math.floor(t.rest / 60) : 0;
    el.fRestSec.value = t ? t.rest % 60 : (col.mode === "parallel" ? 0 : 15);
    el.fRounds.value = t ? t.rounds : 1;

    el.fStack.textContent = "";
    board.columns.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name + (c.mode === "parallel" ? " (parallel)" : " (in order)");
      if (c.id === col.id) o.selected = true;
      el.fStack.appendChild(o);
    });

    el.editor.showModal();
    el.fName.focus();
  }

  function num(input, max) {
    var v = Math.round(Number(input.value));
    if (!isFinite(v) || v < 0) v = 0;
    return Math.min(v, max);
  }

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var work = num(el.fWorkMin, 600) * 60 + num(el.fWorkSec, 59);
    if (work < 1) work = 1;                       // a zero-length interval can't run
    var body = {
      name: (el.fName.value || "").trim().slice(0, 40) || "Timer",
      work: work,
      rest: num(el.fRestMin, 600) * 60 + num(el.fRestSec, 59),
      rounds: Math.max(1, num(el.fRounds, 99))
    };
    var target = findColumn(el.fStack.value) || editingCol;

    if (editing) {
      editing.name = body.name; editing.work = body.work;
      editing.rest = body.rest; editing.rounds = body.rounds;
      if (target !== editingCol) {                 // moved to another stack
        editingCol.timers = editingCol.timers.filter(function (t) { return t.id !== editing.id; });
        target.timers.push(editing);
      }
    } else {
      target.timers.push({ id: uid("t"), name: body.name, work: body.work, rest: body.rest, rounds: body.rounds });
    }
    editing = null; editingCol = null;
    el.editor.close();
    persist(); render();
  });

  el.cancelBtn.addEventListener("click", function () { editing = null; editingCol = null; el.editor.close(); });

  function openRenamer(col) {
    renaming = col;
    el.rName.value = col.name;
    el.renamer.showModal();
    el.rName.focus();
    el.rName.select();
  }

  el.renameForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (renaming) renaming.name = (el.rName.value || "").trim().slice(0, 30) || "Stack";
    renaming = null;
    el.renamer.close();
    persist(); render();
  });
  el.renameCancel.addEventListener("click", function () { renaming = null; el.renamer.close(); });

  function askDeleteColumn(col) {
    el.confirmTitle.textContent = "Delete " + col.name;
    el.confirmText.textContent = col.timers.length
      ? "This removes the stack and its " + col.timers.length + (col.timers.length === 1 ? " timer." : " timers.")
      : "This removes the empty stack.";
    confirmFn = function () {
      board.columns = board.columns.filter(function (c) { return c.id !== col.id; });
      delete runs[keyForColumn(col)];
      col.timers.forEach(function (t) { delete runs[keyForTimer(t)]; });
      persist(); render();
    };
    el.confirmer.showModal();
  }

  el.confirmYes.addEventListener("click", function () {
    var fn = confirmFn; confirmFn = null;
    el.confirmer.close();
    if (fn) fn();
  });
  el.confirmNo.addEventListener("click", function () { confirmFn = null; el.confirmer.close(); });

  /* ================= chrome ================= */

  el.newColBtn.addEventListener("click", newColumn);

  el.soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    el.soundBtn.setAttribute("aria-pressed", String(soundOn));
    el.soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    if (!soundOn) stopAlarm();
    else if (Object.keys(alarming).length) startAlarm();
  });

  document.addEventListener("keydown", function (e) {
    if (el.editor.open || el.renamer.open || el.confirmer.open) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
    if (e.key === "Escape" && Object.keys(alarming).length) {
      Object.keys(alarming).forEach(endRun);
    }
  });

  /* A backgrounded tab stops getting frames; elapsed time comes from
     the timestamps, so just catch up on return. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && anyTicking()) { raf = null; ensureLoop(); }
  });

  applyLayout();
  render();
})();
</script>
